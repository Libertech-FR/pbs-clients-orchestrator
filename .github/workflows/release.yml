name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: copy sources
        run: |
          mkdir -p .debpkg/etc/pbs_backup_orchestrator/conf.d
          cp pbs_backup_orchestrator.py .debpkg/usr/bin
          chmod 700 .debpkg//usr/bin/pbs_backup_orchestrator.py
          cp conf.d/* .debpkg/etc/pbs_backup_orchestrator/conf.d
          cp README.* .debpkg/etc/pbs_backup_orchestrator
      - uses: jiro4989/build-deb-action@v3
        with:
           package: pbs-clients-orchestrator
           package_root: .debpkg
           maintainer: Libertech
           version: ${{ github.ref }} # refs/tags/v*.*.*
           arch: 'amd64'
           depends: 'python3, python3-yaml'
           desc: 'Orchestrator client for pbs'
           homepage: 'https://github.com/Libertech-FR/pbs-clients-orchestrator'
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: pbs-clients*
          overwrite: true
          file_glob: true